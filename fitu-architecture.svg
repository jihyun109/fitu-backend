<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 880" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#7a8a99"/>
    </marker>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1400" height="880" fill="#f8f9fb" rx="12"/>

  <!-- ==================== External (Right, above AWS) ==================== -->
  <text x="1100" y="28" font-size="11" fill="#6b7785" font-weight="600" letter-spacing="1.5">EXTERNAL</text>

  <!-- Kakao OAuth: x=1080-1230, y=40-90 -->
  <rect x="1080" y="40" width="150" height="50" rx="10" fill="#fee500" stroke="#f9d71c" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1155" y="61" text-anchor="middle" font-size="11" fill="#3c1e1e">OAuth 2.0</text>
  <text x="1155" y="78" text-anchor="middle" font-size="13" fill="#3c1e1e" font-weight="700">Kakao Login</text>

  <!-- Gmail SMTP: x=1250-1400, y=40-90 -->
  <rect x="1250" y="40" width="140" height="50" rx="10" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1320" y="61" text-anchor="middle" font-size="11" fill="#8b949e">Email</text>
  <text x="1320" y="78" text-anchor="middle" font-size="13" fill="#2d3748" font-weight="700">Gmail SMTP</text>

  <!-- ==================== Client (Left) ==================== -->
  <rect x="30" y="350" width="140" height="60" rx="10" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="100" y="375" text-anchor="middle" font-size="11" fill="#8b949e">Mobile App</text>
  <text x="100" y="392" text-anchor="middle" font-size="13" fill="#2d3748" font-weight="600">Client</text>

  <!-- ==================== Kubernetes Cluster ==================== -->
  <rect x="220" y="110" width="820" height="580" rx="14" fill="#eef2fa" stroke="#326ce5" stroke-width="2" stroke-dasharray="8,4"/>
  <rect x="236" y="100" width="220" height="22" rx="4" fill="#f8f9fb"/>
  <text x="246" y="116" font-size="13" fill="#326ce5" font-weight="700">Kubernetes Cluster (k3s)</text>

  <!-- ==================== monitoring Namespace (right side of K8s) ==================== -->
  <!-- monitoring: x=620-1030, y=135-230 -->
  <rect x="620" y="135" width="410" height="95" rx="12" fill="#e8f5e9" stroke="#43a047" stroke-width="1.5" stroke-dasharray="6,3"/>
  <rect x="636" y="125" width="200" height="22" rx="4" fill="#f8f9fb"/>
  <text x="646" y="141" font-size="12" fill="#43a047" font-weight="700">Namespace: monitoring</text>

  <!-- Prometheus: x=640-760, y=155-210 -->
  <rect x="640" y="155" width="120" height="55" rx="8" fill="#fff3e0" stroke="#fb8c00" stroke-width="1.3" filter="url(#shadow)"/>
  <text x="700" y="178" text-anchor="middle" font-size="11" fill="#e65100">Metrics</text>
  <text x="700" y="196" text-anchor="middle" font-size="11" fill="#2d3748" font-weight="600">Prometheus</text>

  <!-- Grafana: x=775-895, y=155-210 -->
  <rect x="775" y="155" width="120" height="55" rx="8" fill="#fff3e0" stroke="#fb8c00" stroke-width="1.3" filter="url(#shadow)"/>
  <text x="835" y="178" text-anchor="middle" font-size="11" fill="#e65100">Dashboard</text>
  <text x="835" y="196" text-anchor="middle" font-size="11" fill="#2d3748" font-weight="600">Grafana</text>

  <!-- Pyroscope: x=910-1020, y=155-210 -->
  <rect x="910" y="155" width="110" height="55" rx="8" fill="#fff3e0" stroke="#fb8c00" stroke-width="1.3" filter="url(#shadow)"/>
  <text x="965" y="178" text-anchor="middle" font-size="11" fill="#e65100">Profiling</text>
  <text x="965" y="196" text-anchor="middle" font-size="11" fill="#2d3748" font-weight="600">Pyroscope</text>

  <!-- ==================== Traefik Ingress ==================== -->
  <rect x="250" y="320" width="140" height="120" rx="10" fill="#ffffff" stroke="#4a90d9" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="320" y="360" text-anchor="middle" font-size="11" fill="#4a90d9">Ingress</text>
  <text x="320" y="378" text-anchor="middle" font-size="14" fill="#2d3748" font-weight="700">Traefik</text>
  <text x="320" y="402" text-anchor="middle" font-size="9" fill="#8b949e">/api/* → App</text>
  <text x="320" y="416" text-anchor="middle" font-size="9" fill="#8b949e">/ws → Chat</text>

  <!-- ==================== fitu Namespace ==================== -->
  <rect x="430" y="280" width="590" height="390" rx="12" fill="#f1f8e9" stroke="#558b2f" stroke-width="1.5" stroke-dasharray="6,3"/>
  <rect x="446" y="270" width="160" height="22" rx="4" fill="#f8f9fb"/>
  <text x="456" y="286" font-size="12" fill="#558b2f" font-weight="700">Namespace: fitu</text>

  <!-- ──── App Service 서브그룹 ──── -->
  <rect x="460" y="340" width="260" height="150" rx="10" fill="#dcedc8" stroke="#66bb6a" stroke-width="1.2" stroke-dasharray="4,3"/>
  <rect x="476" y="330" width="100" height="20" rx="4" fill="#dcedc8"/>
  <text x="486" y="344" font-size="11" fill="#66bb6a" font-weight="600">App Service</text>

  <rect x="480" y="360" width="100" height="55" rx="8" fill="#e8f5e9" stroke="#66bb6a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="530" y="381" text-anchor="middle" font-size="11" fill="#558b2f">Spring Boot</text>
  <text x="530" y="397" text-anchor="middle" font-size="11" fill="#2d3748" font-weight="700">Pod 1</text>

  <rect x="600" y="360" width="100" height="55" rx="8" fill="#e8f5e9" stroke="#66bb6a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="650" y="381" text-anchor="middle" font-size="11" fill="#558b2f">Spring Boot</text>
  <text x="650" y="397" text-anchor="middle" font-size="11" fill="#2d3748" font-weight="700">Pod 2</text>

  <!-- ──── Chat Service 서브그룹 ──── -->
  <rect x="460" y="510" width="260" height="130" rx="10" fill="#e8eaf6" stroke="#5c6bc0" stroke-width="1.2" stroke-dasharray="4,3"/>
  <rect x="476" y="500" width="110" height="20" rx="4" fill="#e8eaf6"/>
  <text x="486" y="514" font-size="11" fill="#5c6bc0" font-weight="600">Chat Service</text>

  <rect x="480" y="530" width="100" height="55" rx="8" fill="#e8eaf6" stroke="#5c6bc0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="530" y="551" text-anchor="middle" font-size="11" fill="#283593">Spring Boot</text>
  <text x="530" y="567" text-anchor="middle" font-size="11" fill="#2d3748" font-weight="700">Pod 1</text>

  <rect x="600" y="530" width="100" height="55" rx="8" fill="#e8eaf6" stroke="#5c6bc0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="650" y="551" text-anchor="middle" font-size="11" fill="#283593">Spring Boot</text>
  <text x="650" y="567" text-anchor="middle" font-size="11" fill="#2d3748" font-weight="700">Pod 2</text>

  <!-- ──── MongoDB ──── -->
  <rect x="790" y="530" width="150" height="55" rx="10" fill="#e8f5e9" stroke="#4caf50" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="865" y="551" text-anchor="middle" font-size="10" fill="#2e7d32">Chat Database</text>
  <text x="865" y="570" text-anchor="middle" font-size="14" fill="#2d3748" font-weight="700">MongoDB</text>

  <!-- ==================== AWS (Right) ==================== -->
  <rect x="1080" y="300" width="290" height="380" rx="14" fill="#fff8e1" stroke="#ff9800" stroke-width="2" stroke-dasharray="8,4"/>
  <rect x="1096" y="290" width="56" height="22" rx="4" fill="#f8f9fb"/>
  <text x="1106" y="306" font-size="13" fill="#ff9800" font-weight="700">AWS</text>

  <rect x="1110" y="330" width="230" height="70" rx="10" fill="#fff8e1" stroke="#ffa726" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1225" y="355" text-anchor="middle" font-size="11" fill="#e65100">Primary Database</text>
  <text x="1225" y="375" text-anchor="middle" font-size="15" fill="#2d3748" font-weight="700">RDS MySQL 8</text>

  <rect x="1110" y="430" width="230" height="70" rx="10" fill="#fff8e1" stroke="#ffa726" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1225" y="455" text-anchor="middle" font-size="11" fill="#e65100">File Storage</text>
  <text x="1225" y="475" text-anchor="middle" font-size="15" fill="#2d3748" font-weight="700">S3</text>

  <rect x="1110" y="530" width="230" height="70" rx="10" fill="#fce4ec" stroke="#ef5350" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1225" y="558" text-anchor="middle" font-size="10" fill="#c62828">Cache / Pub-Sub / Stream</text>
  <text x="1225" y="578" text-anchor="middle" font-size="14" fill="#2d3748" font-weight="700">ElastiCache</text>

  <!-- ==================== CI/CD (Bottom Right) ==================== -->
  <text x="1100" y="730" font-size="11" fill="#6b7785" font-weight="600" letter-spacing="1.5">CI / CD</text>

  <rect x="1100" y="745" width="140" height="50" rx="10" fill="#24292e" filter="url(#shadow)"/>
  <text x="1170" y="766" text-anchor="middle" font-size="11" fill="#8b949e">GitHub</text>
  <text x="1170" y="781" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="600">Actions</text>

  <rect x="1100" y="825" width="140" height="50" rx="10" fill="#2496ed" filter="url(#shadow)"/>
  <text x="1170" y="846" text-anchor="middle" font-size="11" fill="#a8d8ff">Docker</text>
  <text x="1170" y="861" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="600">Hub</text>

  <!-- ======================================================== -->
  <!-- ARROWS                                                    -->
  <!-- ======================================================== -->

  <!-- 1. Client(170,380) → Ingress(250,380) -->
  <line x1="170" y1="380" x2="250" y2="380" stroke="#7a8a99" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="200" y="372" font-size="9" fill="#8b949e">HTTPS</text>

  <!-- 2. Ingress(390,360) → App Service left(460,415) -->
  <path d="M390,360 L420,360 L420,415 L460,415" stroke="#7a8a99" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="400" y="352" font-size="9" fill="#558b2f" font-weight="600">/api/*</text>

  <!-- 3. Ingress(390,400) → Chat Service left(460,575) -->
  <path d="M390,400 L420,400 L420,575 L460,575" stroke="#7a8a99" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="395" y="440" font-size="9" fill="#5c6bc0" font-weight="600">/ws</text>

  <!-- 4. App Service top(590,340) → Prometheus bottom(700,210) -->
  <path d="M590,340 L590,250 L700,250 L700,210" stroke="#7a8a99" stroke-width="1.2" fill="none" marker-end="url(#arrow)" stroke-dasharray="4,3"/>

  <!-- 5. App Service top(590,340) → Pyroscope bottom(965,210) -->
  <path d="M590,340 L590,245 L965,245 L965,210" stroke="#7a8a99" stroke-width="1.2" fill="none" marker-end="url(#arrow)" stroke-dasharray="4,3"/>

  <!-- 6. App Service right(720,415) → Kakao left(1080,65) -->
  <path d="M720,415 L1050,415 L1050,65 L1080,65" stroke="#7a8a99" stroke-width="1.2" fill="none" marker-end="url(#arrow)" stroke-dasharray="5,3"/>

  <!-- 7. App Service right(720,415) → Gmail left(1250,65) -->
  <path d="M720,415 L1060,415 L1060,65 L1250,65" stroke="#7a8a99" stroke-width="1.2" fill="none" marker-end="url(#arrow)" stroke-dasharray="5,3"/>

  <!-- 8. Chat Service top(590,510) → Pyroscope bottom(965,210) — route left of App Service -->
  <path d="M590,510 L590,497 L440,497 L440,245 L965,245 L965,210" stroke="#7a8a99" stroke-width="1.2" fill="none" marker-end="url(#arrow)" stroke-dasharray="4,3"/>

  <!-- 9. App Service right(720,415) → RDS left(1110,365) -->
  <path d="M720,415 L900,415 L900,365 L1110,365" stroke="#7a8a99" stroke-width="1.3" fill="none" marker-end="url(#arrow)"/>

  <!-- 10. App Service right(720,415) → S3 left(1110,465) -->
  <path d="M720,415 L900,415 L900,465 L1110,465" stroke="#7a8a99" stroke-width="1.2" fill="none" marker-end="url(#arrow)" stroke-dasharray="5,3"/>
  <text x="1050" y="458" font-size="9" fill="#8b949e">Image Upload</text>

  <!-- 11. App Service right(720,415) → ElastiCache left(1110,565) -->
  <path d="M720,415 L1000,415 L1000,565 L1110,565" stroke="#7a8a99" stroke-width="1.3" fill="none" marker-end="url(#arrow)"/>

  <!-- 12. Chat Service right(720,575) → MongoDB left(790,557) -->
  <path d="M720,575 L755,575 L755,557 L790,557" stroke="#7a8a99" stroke-width="1.3" fill="none" marker-end="url(#arrow)"/>

  <!-- 13. Chat Service right(720,575) → ElastiCache left(1110,565) — route below MongoDB -->
  <path d="M720,575 L755,575 L755,600 L1000,600 L1000,565 L1110,565" stroke="#7a8a99" stroke-width="1.2" fill="none" marker-end="url(#arrow)" stroke-dasharray="5,3"/>
  <text x="850" y="615" font-size="9" fill="#8b949e">Pub/Sub</text>

  <!-- 14. Prometheus → Grafana -->
  <line x1="760" y1="183" x2="775" y2="183" stroke="#7a8a99" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 15b. Pyroscope → Grafana -->
  <line x1="910" y1="183" x2="895" y2="183" stroke="#7a8a99" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 15. GitHub Actions → Docker Hub -->
  <line x1="1170" y1="795" x2="1170" y2="825" stroke="#7a8a99" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 16. Docker Hub → fitu Namespace (Deploy) -->
  <path d="M1100,850 L1050,850 L1050,650 L1020,650" stroke="#7a8a99" stroke-width="1.5" fill="none" marker-end="url(#arrow)" stroke-dasharray="6,3"/>
  <text x="1055" y="750" font-size="9" fill="#8b949e">Deploy</text>

</svg>
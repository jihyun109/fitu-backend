# Grafana Tempo Helm values
# 분산 트레이스 시계열 저장소. Prometheus와 동일한 위치 (메트릭 vs 트레이스).
# 설치:
#   helm repo add grafana https://grafana.github.io/helm-charts
#   helm install tempo grafana/tempo -n monitoring -f tempo-values.yaml
# 업그레이드:
#   helm upgrade tempo grafana/tempo -n monitoring -f tempo-values.yaml

# 단일 바이너리 모드 — 모든 컴포넌트(ingester, querier, compactor 등)를 한 Pod에서 실행
# 운영 단순. 트래픽 수십~수백 RPS 환경에 충분.
# 트래픽 자라면 distributed 모드로 전환 (별도 chart: grafana/tempo-distributed)
tempo:
  reportingEnabled: false   # 익명 사용량 통계 안 보냄

  # trace retention 정책 — 7일 후 자동 삭제
  retention: 168h           # 7 * 24h

  # OTLP 수신기 활성화 (Collector → Tempo로 push 받는 입구)
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  # 메트릭 추출 (선택). trace에서 service graph·span metric 자동 생성 가능.
  # 처음엔 끄고 안정화 후 검토.
  metricsGenerator:
    enabled: false

  # storage backend — 일단 로컬 PVC. 나중에 S3/GCS로 교체 가능.
  storage:
    trace:
      backend: local
      local:
        path: /var/tempo/traces

  resources:
    requests:
      cpu: "50m"
      memory: 256Mi
    limits:
      cpu: "200m"
      memory: 512Mi

# 영구 저장 — Pod 재시작·이전 시 trace 보존
persistence:
  enabled: true
  size: 50Gi               # 7일 retention + 부하테스트 가산 + 안전 margin
  # storageClassName: local-path   # k3s 기본 storageClass (필요 시 명시)
